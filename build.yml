name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Build
        run: |
          npm init -y
          npm i @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          mkdir -p www
          cp "$(ls *.html | head -n1)" www/index.html
          echo '{"appId":"com.habits.daily","appName":"Habits","webDir":"www"}' > capacitor.config.json
          npx cap add android
          npx cap sync android
          sed -i 's|<string name="app_name">.*</string>|<string name="app_name">تقييمي اليومي</string>|' android/app/src/main/res/values/strings.xml
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: app-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
